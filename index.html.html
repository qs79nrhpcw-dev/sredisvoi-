  packs: 'spy-own-custom-packs-v1',
  stats: 'spy-own-stats-v1'
};
const app = document.querySelector('#app');
const toastEl = document.querySelector('#toast');

const state = {
  ready:false,
  firebase:false,
  firebaseError:null,
  screen:'home',
  userId:null,
  tgUser:null,
  pendingJoinCode:null,
  profile: loadJSON(STORAGE.profile, null) || { name:'', avatar:'🕵️' },
  stats: loadJSON(STORAGE.stats, { games:0, wins:0, spyGames:0, spyWins:0 }),
  customPacks: loadJSON(STORAGE.packs, []),
  roomCode:null,
  room:null,
  players:[],
  messages:[],
  unsub:[],
  lastCardHidden:true,
  modal:null,
  currentGuess:'',
  localRooms: loadJSON('spy-own-local-rooms', {})
};

let F = {};

function loadJSON(key, fallback){ try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }}
function saveJSON(key, value){ localStorage.setItem(key, JSON.stringify(value)); }
function uid(){ return 'u_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function code(){ return Math.random().toString(36).replace(/[^a-z0-9]/g,'').slice(2,7).toUpperCase(); }
function escapeHTML(s=''){ return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function now(){ return Date.now(); }
function allPacks(){ return [...DEFAULT_PACKS, ...state.customPacks]; }
function getPack(id){ return allPacks().find(p=>p.id===id) || DEFAULT_PACKS[0]; }
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 2200); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function initials(name){ return (name || '?').trim().slice(0,1).toUpperCase(); }
function me(){ return state.players.find(p=>p.id===state.userId); }
function isHost(){ return state.room && state.room.hostId === state.userId; }
function activePlayers(){ return state.players.filter(p=>p.status !== 'observer' && p.status !== 'left'); }
function alivePlayers(){ return activePlayers().filter(p=>!(state.room?.eliminatedSpyIds||[]).includes(p.id)); }
function assignmentFor(id=state.userId){ return state.room?.assignments?.[id]; }

async function boot(){
  setupTelegram();
  const fallbackId = localStorage.getItem('spy-own-user-id') || uid();
  state.userId = state.tgUser?.id ? `tg_${state.tgUser.id}` : fallbackId;
  localStorage.setItem('spy-own-user-id', state.userId);
  await bootFirebase();
  state.ready = true;
  render();
  if(state.pendingJoinCode){
    const c = state.pendingJoinCode;
    state.pendingJoinCode = null;
    setTimeout(()=>enterRoom(c), 300);
  }
}

function setupTelegram(){
  const tg = window.Telegram?.WebApp;
  const urlRoom = new URLSearchParams(location.search).get('room');
  if(urlRoom) state.pendingJoinCode = urlRoom;
  if(!tg) return;
  try{
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#07070b');
    tg.setBackgroundColor('#07070b');
    state.tgUser = tg.initDataUnsafe?.user || null;
    const startParam = tg.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('tgWebAppStartParam');
    if(startParam) state.pendingJoinCode = startParam;
    if(state.tgUser && !state.profile.name){
      const fullName = [state.tgUser.first_name, state.tgUser.last_name].filter(Boolean).join(' ').trim();
      state.profile.name = fullName || state.tgUser.username || '';
      state.profile.avatar = state.profile.avatar || '🕵️';
      saveJSON(STORAGE.profile, state.profile);
    }
  }catch(e){}
}

async function bootFirebase(){
  const config = window.FIREBASE_CONFIG;
  if(!config || !config.projectId || config.projectId.includes('PASTE')) return;
  try{
    const [appMod, authMod, fsMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js')
    ]);
    const fbApp = appMod.initializeApp(config);
    const auth = authMod.getAuth(fbApp);
    await authMod.signInAnonymously(auth);
    if(!state.tgUser?.id) state.userId = auth.currentUser.uid;
    F = { ...fsMod, db: fsMod.getFirestore(fbApp), serverTimestamp: fsMod.serverTimestamp };
    state.firebase = true;
  }catch(err){
    console.error(err);
    state.firebaseError = err.message;
  }
}

function topbar(){
  return `<div class="topbar">
    <div class="brand" data-action="home"><div class="logo">S</div><div><h1>Свой среди чужих</h1><p>${state.firebase ? 'онлайн готов' : 'демо без базы'}</p></div></div>
    <div class="avatar" data-action="profile">${escapeHTML(state.profile.avatar || initials(state.profile.name))}</div>
  </div>`;
}

function render(){
  if(!state.ready){ app.innerHTML = `<div class="hero"><h2>Загрузка...</h2></div>`; return; }
  let body = '';
  if(state.screen === 'home') body = homeScreen();
  if(state.screen === 'profile') body = profileScreen();
  if(state.screen === 'rules') body = rulesScreen();
  if(state.screen === 'settingsGlobal') body = globalSettingsScreen();
  if(state.screen === 'packs') body = packsScreen();
  if(state.screen === 'lobby') body = lobbyScreen();
  if(state.screen === 'card') body = cardScreen();
  if(state.screen === 'play') body = playScreen();
  if(state.screen === 'vote') body = voteScreen();
  if(state.screen === 'results') body = resultsScreen();
  app.innerHTML = topbar() + `<div class="screen">${body}</div>` + modalHTML();
}

  return {
    playerMin:3, playerMax:15, spyCount:1, rolesEnabled:true, spyFakeRole:false, allowNoRoles:true,

}

function lobbyScreen(){

  const playerCards = state.players.map(p=>`<div class="player"><span class="dot ${p.status==='observer'?'obs':p.status==='left'?'out':''}"></span><div><b>${escapeHTML(p.avatar||'')} ${escapeHTML(p.name)}</b><div class="tiny">${p.id===state.room.hostId?'ведущий':p.status==='observer'?'наблюдатель':'игрок'}</div></div></div>`).join('');
  const hostSettings = isHost() ? `<div class="card"><h3>Настройки раунда</h3>
    <div class="formgrid">
      ${selectHTML('packId','Набор', allPacks().map(p=>[p.id,p.name]), s.packId)}
      ${selectHTML('spyCount','Шпионов', [[1,'1'],[2,'2'],[3,'3']], s.spyCount)}
      ${selectHTML('rolesEnabled','Роли', [['true','включены'],['false','выключены']], String(s.rolesEnabled))}
      ${selectHTML('spyFakeRole','Фейковая роль шпиону', [['false','нет'],['true','да']], String(s.spyFakeRole))}
      ${selectHTML('duration','Время', [[180,'3 минуты'],[300,'5 минут'],[420,'7 минут'],[600,'10 минут'],[900,'15 минут']], s.duration)}
      ${selectHTML('voteType','Голосование', [['secret','тайное'],['open','открытое']], s.voteType)}
      ${selectHTML('leaderMode','Режим ведущего', [['false','нет'],['true','да']], String(s.leaderMode))}
      ${selectHTML('mode','Режим', [['classic','обычный'],['hard','сложный'],['traitor','предатель позже'],['category','шпион знает категорию позже']], s.mode)}

    <div class="spacer"></div><button class="button" data-action="save-room-settings">Сохранить настройки</button>

  </div>` : `<div class="card"><h3>Ожидание ведущего</h3><p>Ведущий выбирает правила и запускает раунд.</p></div>`;

function selectHTML(id,label,opts,value){
  return `<div><label>${label}</label><select id="${id}">${opts.map(([v,t])=>`<option value="${v}" ${String(v)===String(value)?'selected':''}>${escapeHTML(t)}</option>`).join('')}</select></div>`;
}

function cardScreen(){
  const a = assignmentFor(); const s = state.room?.settings || {};
  if(!a) return `<div class="card">Карточка ещё не выдана</div>`;
  if(state.lastCardHidden){
    return `<div class="cardReveal"><div><div class="secretStamp">секретная карта</div><div class="bigTitle">Нажми, чтобы посмотреть</div><p class="muted">Показывай экран только себе.</p><button class="button" data-action="show-card">Показать карту</button></div></div>`;
  }
  const isSpy = a.team === 'spy';
  return `<div class="cardReveal"><div>
    <div class="secretStamp">${isSpy ? 'ты шпион' : 'ты свой'}</div>
    <div class="bigTitle">${isSpy ? 'ШПИОН' : escapeHTML(a.location)}</div>
    <p class="muted">${a.role ? `Роль: <b>${escapeHTML(a.role)}</b>` : (s.rolesEnabled ? 'Роль не используется' : 'Раунд без ролей')}</p>
    ${isSpy && a.fakeRole ? `<p class="warn">Фейковая роль: <b>${escapeHTML(a.fakeRole)}</b></p>` : ''}
    <div class="spacer"></div><button class="button secondary" data-action="hide-card">Скрыть</button>
    <button class="button" data-action="go-play">Перейти к игре</button>
  </div></div>`;
}

function playScreen(){
  const r=state.room, s=r.settings || {}; const players=alivePlayers(); const current=players[r.currentTurnIndex % Math.max(players.length,1)];
  const remain = Math.max(0, Math.floor(((r.startedAt||now()) + (s.duration||420)*1000 - now())/1000));
  const m = String(Math.floor(remain/60)).padStart(2,'0'), sec=String(remain%60).padStart(2,'0');
  const isSpy = assignmentFor()?.team === 'spy';
  const eliminated = r.eliminatedSpyIds || [];
  return `<div class="grid">
    <div class="card"><h3>Раунд идет</h3><div class="timer">${m}:${sec}</div><p class="muted">Первый игрок был выбран случайно. Дальше вопросы идут по кругу.</p><div class="spacer"></div><button class="button secondary" data-action="card">Моя карта</button>${isSpy ? `<button class="button" data-action="guess-modal">Я знаю локацию</button>`:''}</div>
    <div class="turnBox"><h3>Сейчас спрашивает</h3><div class="bigTitle" style="font-size:28px">${current ? escapeHTML(current.avatar||'') + ' ' + escapeHTML(current.name) : '—'}</div><button class="button secondary" data-action="next-turn">Следующий по кругу</button></div>
    <div class="card"><h3>Игроки</h3><div class="players">${players.map(p=>`<div class="player"><span class="dot"></span><div><b>${escapeHTML(p.avatar||'')} ${escapeHTML(p.name)}</b><div class="tiny">${eliminated.includes(p.id)?'вычисленный шпион':'в игре'}</div></div></div>`).join('')}</div></div>
    <div class="card"><h3>Голосование</h3><p>Можно начать голосование в любой момент, если большинство готово.</p><div class="spacer"></div><button class="button danger" data-action="start-vote">Начать голосование</button></div>
    ${chatHTML()}
  </div>`;
}

function voteScreen(){
  const r=state.room; const votes=r.votes||{}; const voted=!!votes[state.userId]; const players=alivePlayers();
  const visible = r.settings?.voteType === 'open';
  return `<div class="card"><h3>Голосование</h3><p class="muted">Выберите, кто шпион. Если выбрали не того — шпион побеждает.</p>
    <div class="locationList">${players.map(p=>`<button class="button ${voted?'ghost':'secondary'}" data-action="vote-player" data-id="${p.id}" ${voted?'disabled':''}>${escapeHTML(p.avatar||'')} ${escapeHTML(p.name)} ${visible ? `<span class="tiny">· голосов: ${Object.values(votes).filter(v=>v===p.id).length}</span>`:''}</button>`).join('')}</div>
    <div class="spacer"></div><p>Проголосовали: <b>${Object.keys(votes).length}/${players.length}</b></p>
    ${isHost()?`<button class="button" data-action="finish-vote">Завершить голосование</button><button class="button ghost" data-action="cancel-vote">Отменить</button>`:''}
  </div>${chatHTML()}`;
}

  const spyNames = (r.spyIds||[]).map(id=>state.players.find(p=>p.id===id)?.name || '???').join(', ');
  const myTeam = assignmentFor()?.team;
  return `<div class="cardReveal"><div>
    <div class="secretStamp">итог раунда</div>
    <div class="bigTitle">${winner==='spies'?'Победа шпионов':'Победа своих'}</div>
    <p>Локация: <b>${escapeHTML(loc||'—')}</b></p><p>Шпион${(r.spyIds||[]).length>1?'ы':''}: <b>${escapeHTML(spyNames)}</b></p>

}

function chatHTML(){
  const msgs = state.messages.slice(-60).map(m=>`<div class="msg"><b>${escapeHTML(m.name||'Игрок')}:</b> <span>${escapeHTML(m.text||'')}</span></div>`).join('');
  return `<div class="card"><h3>Чат</h3><div class="chat">${msgs || '<p class="muted">Сообщений пока нет</p>'}</div><div class="row" style="margin-top:10px"><input class="input" id="chatText" placeholder="Сообщение" style="flex:1;min-width:180px"><button class="button secondary" data-action="send-chat">Отправить</button></div></div>`;
}

function modalHTML(){
  if(!state.modal) return '';
  if(state.modal === 'join') return `<div class="modal" data-action="close-modal"><div class="modalInner" onclick="event.stopPropagation()"><h3>Войти в комнату</h3><label>Код комнаты</label><input class="input" id="joinCode" placeholder="Например, A7K2Q" maxlength="8"><div class="spacer"></div><button class="button" data-action="join-room">Войти</button><button class="button ghost" data-action="close-modal">Закрыть</button></div></div>`;
  if(state.modal === 'guess'){
    const pack = getPack(state.room?.settings?.packId);
    return `<div class="modal"><div class="modalInner"><h3>Назови локацию</h3><p class="muted">Если угадаешь — шпионы победят. Если ошибёшься — победят свои.</p><div class="locationList">${pack.locations.map(l=>`<button class="button secondary" data-action="spy-guess" data-location="${escapeHTML(l.name)}">${escapeHTML(l.name)}</button>`).join('')}</div><div class="spacer"></div><button class="button ghost" data-action="close-modal">Закрыть</button></div></div>`;
  }
  if(state.modal?.startsWith('pack:')){
    const id=state.modal.split(':')[1]; const p=getPack(id);
    return `<div class="modal"><div class="modalInner"><h3>${escapeHTML(p.name)}</h3><p class="muted">${p.locations.length} локаций</p><div class="locationList">${p.locations.map(l=>`<div class="locationItem"><b>${escapeHTML(l.name)}</b><span class="tiny">${escapeHTML(l.roles.join(', '))}</span></div>`).join('')}</div><div class="spacer"></div><button class="button secondary" data-action="share-pack" data-pack="${p.id}">Скопировать код набора</button><button class="button ghost" data-action="close-modal">Закрыть</button></div></div>`;
  }
  if(state.modal === 'import') return `<div class="modal"><div class="modalInner"><h3>Импорт набора</h3><textarea id="importText" rows="8" placeholder="Вставь код набора"></textarea><div class="spacer"></div><button class="button" data-action="do-import-pack">Импортировать</button><button class="button ghost" data-action="close-modal">Закрыть</button></div></div>`;
  return '';
}


function roomInviteText(){
  const bot = window.BOT_USERNAME || '';
  const c = state.roomCode || '';
  if(bot) return `https://t.me/${bot}?startapp=${encodeURIComponent(c)}`;
  return `Код комнаты: ${c}`;
}
async function shareRoom(){
  const text = roomInviteText();
  const tg = window.Telegram?.WebApp;
  try{
    if(tg?.openTelegramLink && text.startsWith('https://t.me/')){
      tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(text)}&text=${encodeURIComponent('Заходи в игру «Свой среди чужих»')}`);
      return;
    }
    await navigator.clipboard?.writeText(text);
    toast('Приглашение скопировано');
  }catch(e){ toast('Скопируй код комнаты: '+state.roomCode); }
}

async function createRoom(){
  if(!state.profile.name.trim()){ state.screen='profile'; render(); toast('Сначала укажи имя'); return; }
  const c=code(); const room={ code:c, hostId:state.userId, status:'lobby', createdAt:now(), settings:roomDefaults(), currentTurnIndex:0, eliminatedSpyIds:[] };
  if(state.firebase){
    await F.setDoc(F.doc(F.db,'rooms',c), room);
  }else{
    state.localRooms[c]=room; saveJSON('spy-own-local-rooms', state.localRooms);
  }
  await enterRoom(c);
}

async function enterRoom(c){
  c=(c||'').trim().toUpperCase(); if(!c) return;
  clearSubs(); state.roomCode=c;
  let room = await readRoom(c);
  if(!room){ toast('Комната не найдена'); return; }
  const status = room.status==='lobby' ? 'active' : 'observer';
  await savePlayer(c, { id:state.userId, name:state.profile.name||'Игрок', avatar:state.profile.avatar||'🕵️', status, joinedAt:now(), lastSeen:now() });
  subscribe(c); state.modal=null; state.screen = room.status==='lobby' ? 'lobby' : room.status; render();
}

async function readRoom(c){
  if(state.firebase){ const snap = await F.getDoc(F.doc(F.db,'rooms',c)); return snap.exists()?snap.data():null; }
  return state.localRooms[c] || null;
}
async function updateRoom(patch){
  if(!state.roomCode) return;
  if(state.firebase){ await F.updateDoc(F.doc(F.db,'rooms',state.roomCode), patch); }
  else { state.localRooms[state.roomCode] = { ...(state.localRooms[state.roomCode]||{}), ...patch }; saveJSON('spy-own-local-rooms', state.localRooms); subscribeLocal(); }
}
async function savePlayer(c, player){
  if(state.firebase){ await F.setDoc(F.doc(F.db,'rooms',c,'players',player.id), player, {merge:true}); }
  else { const r=state.localRooms[c]; r.players = r.players || {}; r.players[player.id]=player; saveJSON('spy-own-local-rooms', state.localRooms); }
}
function clearSubs(){ state.unsub.forEach(fn=>{try{fn()}catch{}}); state.unsub=[]; }
function subscribe(c){
  if(state.firebase){
    state.unsub.push(F.onSnapshot(F.doc(F.db,'rooms',c), snap=>{ state.room=snap.exists()?snap.data():null; if(state.room?.status) state.screen=state.room.status==='lobby'?'lobby':state.room.status; render(); }));
    state.unsub.push(F.onSnapshot(F.collection(F.db,'rooms',c,'players'), snap=>{ state.players=snap.docs.map(d=>d.data()).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)); render(); }));
    state.unsub.push(F.onSnapshot(F.query(F.collection(F.db,'rooms',c,'messages'), F.orderBy('createdAt','asc'), F.limit(80)), snap=>{ state.messages=snap.docs.map(d=>d.data()); render(); }));
  } else subscribeLocal();
}
function subscribeLocal(){ const r=state.localRooms[state.roomCode]; state.room=r; state.players=Object.values(r.players||{}).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)); state.messages=r.messages||[]; }

async function sendChat(){
  const input=document.querySelector('#chatText'); const text=input?.value.trim(); if(!text) return;
  const msg={ id:uid(), name:state.profile.name||'Игрок', text, createdAt:now() };
  if(state.firebase){ await F.addDoc(F.collection(F.db,'rooms',state.roomCode,'messages'), msg); }
  else { const r=state.localRooms[state.roomCode]; r.messages=[...(r.messages||[]), msg]; saveJSON('spy-own-local-rooms', state.localRooms); subscribeLocal(); render(); }
}

async function saveRoomSettings(){
  if(!isHost()) return;
  const val = id => document.querySelector('#'+id)?.value;
  const s = {
    packId:val('packId'), spyCount:Number(val('spyCount')), rolesEnabled:val('rolesEnabled')==='true', spyFakeRole:val('spyFakeRole')==='true',
    duration:Number(val('duration')), voteType:val('voteType'), leaderMode:val('leaderMode')==='true', mode:val('mode'), playerMin:3, playerMax:15, allowNoRoles:true
  };
  await updateRoom({settings:s}); toast('Настройки сохранены');
}

async function startGame(){
  await saveRoomSettings();
  const room = await readRoom(state.roomCode); const s=room.settings||roomDefaults(); const players=activePlayers();
  if(players.length < 3){ toast('Минимум 3 игрока'); return; }
  if(players.length > 15){ toast('Максимум 15 игроков'); return; }
  const spyCount = Math.min(Math.max(1, Number(s.spyCount||1)), Math.max(1, players.length-2));
  const pack = getPack(s.packId); const location = shuffle(pack.locations)[0]; const order = shuffle(players).map(p=>p.id); const spyIds = order.slice(0, spyCount);
  const roles = shuffle(location.roles); const assignments={}; let ri=0;
  players.forEach(p=>{
    const isSpy=spyIds.includes(p.id);
    if(isSpy){ assignments[p.id] = {team:'spy', fakeRole: s.spyFakeRole && s.rolesEnabled ? roles[ri++ % roles.length] : ''}; }
    else { assignments[p.id] = {team:'players', location:location.name, role:s.rolesEnabled ? roles[ri++ % roles.length] : ''}; }
  });
  await updateRoom({ status:'card', secret:{location, packId:pack.id}, assignments, spyIds, order, currentTurnIndex:0, startedAt:now(), eliminatedSpyIds:[], votes:{}, result:null });
  state.lastCardHidden=true; state.screen='card'; render();
}

async function processVote(){
  const r=state.room; const votes=r.votes||{}; const players=alivePlayers();
  if(Object.keys(votes).length < players.length && !confirm('Не все проголосовали. Завершить?')) return;
  const tally={}; Object.values(votes).forEach(id=>tally[id]=(tally[id]||0)+1);
  const sorted=Object.entries(tally).sort((a,b)=>b[1]-a[1]); const top=sorted[0]?.[0];
  if(!top){ toast('Нет голосов'); return; }
  const topVotes=sorted[0][1]; const tie=sorted.filter(x=>x[1]===topVotes).length>1;
  if(tie){ await finishGame('spies','Ничья на голосовании. Шпионы воспользовались хаосом.'); return; }
  const isSpy = (r.spyIds||[]).includes(top);
  if(!isSpy){ await finishGame('spies','На голосовании выбрали не того.'); return; }
  const eliminated=[...(r.eliminatedSpyIds||[]), top];
  const allFound=(r.spyIds||[]).every(id=>eliminated.includes(id));
  if(allFound) await finishGame('players','Все шпионы вычислены.');
  else await updateRoom({status:'play', eliminatedSpyIds:eliminated, votes:{}, currentTurnIndex:(r.currentTurnIndex||0)+1});
}
async function finishGame(winner, reason){
  await updateRoom({status:'results', result:{winner, reason, endedAt:now()}});
  updateLocalStats(winner);
}
function updateLocalStats(winner){
  const a=assignmentFor(); const isSpy=a?.team==='spy'; const win=(winner==='spies' && isSpy) || (winner==='players' && !isSpy);
  state.stats.games += 1; if(win) state.stats.wins += 1; if(isSpy){ state.stats.spyGames += 1; if(win) state.stats.spyWins += 1; }
  saveJSON(STORAGE.stats,state.stats);
}

function addPack(){
  const name=document.querySelector('#newPackName')?.value.trim(); const text=document.querySelector('#newPackText')?.value.trim();
  if(!name || !text){ toast('Добавь название и локации'); return; }
  const locations=text.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{
    const [loc, rolesText=''] = line.split('|');
    const roles=rolesText.split(',').map(x=>x.trim()).filter(Boolean).slice(0,5);
    while(roles.length<5) roles.push('роль '+(roles.length+1));
    return {name:loc.trim(), roles};
  }).filter(x=>x.name);
  if(locations.length<3){ toast('Минимум 3 локации'); return; }
  const p={id:'custom_'+Date.now().toString(36), name, tone:'пользовательский', locations};
  state.customPacks.push(p); saveJSON(STORAGE.packs,state.customPacks); toast('Набор добавлен'); render();
}
function exportPack(id){
  const p=getPack(id); const data=btoa(unescape(encodeURIComponent(JSON.stringify(p))));
  navigator.clipboard?.writeText(data); toast('Код набора скопирован');
}
function importPack(){
  const text=document.querySelector('#importText')?.value.trim(); if(!text) return;
  try{ const p=JSON.parse(decodeURIComponent(escape(atob(text)))); p.id='custom_'+Date.now().toString(36); state.customPacks.push(p); saveJSON(STORAGE.packs,state.customPacks); state.modal=null; toast('Набор импортирован'); render(); }catch(e){ toast('Не получилось импортировать'); }
}

setInterval(()=>{ if(state.room?.status==='play') render(); }, 1000);
setInterval(heartbeat, 10000);

async function heartbeat(){
  if(!state.roomCode || !state.profile.name || !state.room) return;
  const current = state.players.find(p=>p.id===state.userId);
  await savePlayer(state.roomCode, { id:state.userId, name:state.profile.name, avatar:state.profile.avatar||'🕵️', status:current?.status || 'active', joinedAt:current?.joinedAt || now(), lastSeen:now() });
  if(isHost()) await markStalePlayers();
}

async function markStalePlayers(){
  if(!['card','play','vote'].includes(state.room?.status)) return;
  const cutoff = now() - 45000;
  const stale = state.players.filter(p=>p.id!==state.userId && p.status==='active' && p.lastSeen && p.lastSeen < cutoff);
  for(const p of stale){ await savePlayer(state.roomCode, {...p, status:'left'}); }
  const freshPlayers = state.players.map(p => stale.find(x=>x.id===p.id) ? {...p, status:'left'} : p);
  const leftSpies = (state.room.spyIds||[]).filter(id => freshPlayers.find(p=>p.id===id)?.status==='left');
  if(leftSpies.length && (state.room.spyIds||[]).every(id=>leftSpies.includes(id))){
    await finishGame('players','Все шпионы вышли из игры.');
  }
}

document.addEventListener('click', async (e)=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action;
  if(a==='home'){ state.screen='home'; state.modal=null; clearSubs(); render(); }
  if(a==='profile'){ state.screen='profile'; state.modal=null; render(); }
  if(a==='rules'){ state.screen='rules'; render(); }
  if(a==='settings-global'){ state.screen='settingsGlobal'; render(); }
  if(a==='packs'){ state.screen='packs'; render(); }
  if(a==='join-modal'){ state.modal='join'; render(); }
  if(a==='close-modal'){ state.modal=null; render(); }
  if(a==='save-profile'){
    state.profile={name:document.querySelector('#profileName').value.trim(), avatar:document.querySelector('#profileAvatar').value.trim()||'🕵️'}; saveJSON(STORAGE.profile,state.profile); toast('Профиль сохранён'); render();
  }
  if(a==='reset-stats'){ state.stats={games:0,wins:0,spyGames:0,spyWins:0}; saveJSON(STORAGE.stats,state.stats); render(); }
  if(a==='create-room') await createRoom();
  if(a==='join-room') await enterRoom(document.querySelector('#joinCode')?.value);
  if(a==='copy-code'){ navigator.clipboard?.writeText(state.roomCode); toast('Код скопирован'); }
  if(a==='share-room') await shareRoom();
  if(a==='leave-room'){ const p=me(); if(p) await savePlayer(state.roomCode,{...p,status:'left',lastSeen:now()}); clearSubs(); state.roomCode=null; state.room=null; state.players=[]; state.messages=[]; state.screen='home'; render(); }
  if(a==='save-room-settings') await saveRoomSettings();
  if(a==='start-game') await startGame();
  if(a==='show-card'){ state.lastCardHidden=false; render(); }
  if(a==='hide-card'){ state.lastCardHidden=true; render(); }
  if(a==='card'){ state.screen='card'; state.lastCardHidden=true; render(); }
  if(a==='go-play'){ await updateRoom({status:'play', startedAt: state.room.startedAt || now()}); state.screen='play'; render(); }
  if(a==='next-turn'){ await updateRoom({currentTurnIndex:(state.room.currentTurnIndex||0)+1}); }
  if(a==='start-vote'){ await updateRoom({status:'vote', votes:{}}); }
  if(a==='cancel-vote'){ await updateRoom({status:'play', votes:{}}); }
  if(a==='vote-player'){ await updateRoom({votes:{...(state.room.votes||{}), [state.userId]:el.dataset.id}}); }
  if(a==='finish-vote') await processVote();
  if(a==='guess-modal'){ state.modal='guess'; render(); }
  if(a==='spy-guess'){
    const guess=el.dataset.location; const real=state.room.secret.location.name;
    state.modal=null; await finishGame(guess===real?'spies':'players', guess===real?'Шпион угадал локацию.':'Шпион ошибся с локацией.');
  }
  if(a==='send-chat') await sendChat();
  if(a==='new-round'){ await updateRoom({status:'lobby', assignments:null, spyIds:[], secret:null, result:null, votes:{}, eliminatedSpyIds:[]}); }
  if(a==='view-pack'){ state.modal='pack:'+el.dataset.pack; render(); }
  if(a==='add-pack') addPack();
  if(a==='share-pack') exportPack(el.dataset.pack);
  if(a==='import-pack'){ state.modal='import'; render(); }
  if(a==='do-import-pack') importPack();
});

boot();

  </script>
