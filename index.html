let F = {};
let renderQueued = false;
let lastRenderedHTML = '';

function scheduleRender(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(()=>{
    renderQueued = false;
    render();
  });
}

function paint(html){
  if(html === lastRenderedHTML) return;
  const sameScreen = state.screen === state._paintScreen;
  const activeId = document.activeElement?.id || '';
  if(sameScreen && activeId === 'chatText' && state.chatFocused){
    state.pendingRenderAfterChat = true;
    return;
  }
  const scrollY = window.scrollY || document.documentElement.scrollTop || 0;
  const activeValue = document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName) ? document.activeElement.value : null;
  app.innerHTML = html;
  lastRenderedHTML = html;
  if(sameScreen){
    requestAnimationFrame(()=>{
      try{ window.scrollTo({top:scrollY, behavior:'auto'}); }catch(e){ window.scrollTo(0, scrollY); }
      if(activeId){
        const el = document.getElementById(activeId);
        if(el && activeValue !== null && ['INPUT','TEXTAREA'].includes(el.tagName)) el.value = activeValue;
        if(el && ['INPUT','TEXTAREA','SELECT'].includes(el.tagName)) el.focus({preventScroll:true});
      }
    });
  }
  state._paintScreen = state.screen;
}

function loadJSON(key, fallback){ try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }}

function uid(){ return 'u_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function code(){ return Math.random().toString(36).replace(/[^a-z0-9]/g,'').slice(2,7).toUpperCase(); }
function escapeHTML(s=''){ return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

function roomControllerId(){
  if(!state.room) return '';
  const host = state.players.find(p=>p.id===state.room.hostId);
  const hostCanLead = host && host.status !== 'left' && !isEliminated(host.id);
  if(hostCanLead) return host.id;
  const candidates = connectedPlayers()

function signal(kind='warning'){
  try{ window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred(kind); }catch(e){}
  try{ navigator.vibrate?.(kind==='success' ? [80,40,80] : [140,60,140]); }catch(e){}
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = kind==='success' ? 740 : 520;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
    setTimeout(()=>ctx.close?.(), 500);
  }catch(e){}
}

}
function signalResult(room){
  const key = room?.result?.id || `${state.roomCode}_${room?.result?.endedAt || ''}`;
  if(!key || state.lastResultSignalKey === key) return;
  state.lastResultSignalKey = key;
  signal(room?.result?.winner === 'players' ? 'success' : 'warning');
}
function screenForStatus(status){

function applyRoomStatus(room){
  if(!room?.status) return;
  const newStatus = room.status;

  const changed = oldStatus !== newStatus;

  if(newStatus === 'timeup' && changed) signalTimeUp(room);
  if(newStatus === 'results'){
    updateLocalStatsOnce(room.result?.id, room.result?.winner);
    if(changed) signalResult(room);
  }
  const target = screenForStatus(newStatus);
  const isManualCardView = state.screen === 'card' && ['play','timeup','vote'].includes(newStatus);
  if(isManualCardView) return;

    state.screen = target;
  }

  if(!state.room || !state.roomCode) return;
  const nextId = roomControllerId();
  if(!nextId || nextId === state.room.hostId) return;
  if(nextId === state.userId){
    updateRoom({hostId: nextId}).catch(console.error);
    toast('Ведущий вышел или выбыл. Управление передано тебе.');
  }
}

function alivePlayers(){ return activePlayers(); }
function assignmentFor(id=state.userId){ return state.room?.assignments?.[id]; }
function cardReadyMap(){ return state.room?.cardReady || {}; }
function isCardReady(id=state.userId){ return !!cardReadyMap()[id]; }
function cardReadyCount(){
  const ready = cardReadyMap();
  return activePlayers().filter(p=>ready[p.id]).length;
}
function everybodyCardReady(){
  const players = activePlayers();
  const ready = cardReadyMap();
  return players.length > 0 && players.every(p=>ready[p.id]);
}

async function boot(){
  setupTelegram();
  const fallbackId = localStorage.getItem('spy-own-user-id') || uid();
  state.userId = state.tgUser?.id ? `tg_${state.tgUser.id}` : fallbackId;
  localStorage.setItem('spy-own-user-id', state.userId);
  await bootFirebase();
  state.ready = true;
  render();
  if(state.pendingJoinCode){
    const c = state.pendingJoinCode;
    state.pendingJoinCode = null;
    setTimeout(()=>enterRoom(c), 300);
  }
}

function setupTelegram(){
  const tg = window.Telegram?.WebApp;
  const urlRoom = new URLSearchParams(location.search).get('room');
  if(urlRoom) state.pendingJoinCode = urlRoom;
  if(!tg) return;
  try{
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#07070b');
    tg.setBackgroundColor('#07070b');
    state.tgUser = tg.initDataUnsafe?.user || null;
    const startParam = tg.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('tgWebAppStartParam');
    if(startParam) state.pendingJoinCode = startParam;
    if(state.tgUser && !state.profile.name){
      const fullName = [state.tgUser.first_name, state.tgUser.last_name].filter(Boolean).join(' ').trim();
      state.profile.name = fullName || state.tgUser.username || '';
      state.profile.avatar = state.profile.avatar || '🕵️';
      saveJSON(STORAGE.profile, state.profile);
    }
  }catch(e){}
}

async function bootFirebase(){
  const config = window.FIREBASE_CONFIG;
  if(!config || !config.projectId || config.projectId.includes('PASTE')) return;
  try{
    const [appMod, authMod, fsMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js')
    ]);
    const fbApp = appMod.initializeApp(config);
    try{
      const auth = authMod.getAuth(fbApp);
      await authMod.signInAnonymously(auth);
      if(!state.tgUser?.id && auth.currentUser?.uid) state.userId = auth.currentUser.uid;
    }catch(authErr){
      console.warn('Anonymous auth is not enabled yet. Firestore can still work in test mode.', authErr);
    }
    F = { ...fsMod, db: fsMod.getFirestore(fbApp), serverTimestamp: fsMod.serverTimestamp };
    state.firebase = true;
  }catch(err){
    console.error(err);
    state.firebaseError = err.message;
  }
}

const HARD_PACK_IDS = ['elite','danger','night','survival','horror_mystic'];
function normalizeSettingsForMode(raw){
  const s = {...roomDefaults(), ...(raw||{})};
  s.spyCount = Math.max(1, Math.min(3, Number(s.spyCount || 1)));
  s.duration = Number(s.duration || 420);
  s.playerMax = 15;
  if(s.mode === 'hard'){
    s.rolesEnabled = true;
    s.spyFakeRole = true;
    s.voteType = 'secret';
    s.duration = Math.min(s.duration, 420);
    if(!String(s.packId||'').startsWith('custom_') && !HARD_PACK_IDS.includes(s.packId)) s.packId = HARD_PACK_IDS[Math.floor(Math.random()*HARD_PACK_IDS.length)];
  }
  if(s.mode === 'traitor'){
    s.rolesEnabled = true;
    s.voteType = 'secret';
  }
  if(s.mode === 'category'){
    s.rolesEnabled = true;
  }
  if(s.spyFakeRole){
    s.rolesEnabled = true;
  }
  return s;
}
function modeInfoHTML(settings){
  const s = normalizeSettingsForMode(settings);
  const lines = {
    classic: ['Классический режим', 'Шпион знает, что он шпион, но не знает локацию. Настройки ролей и голосования работают как выбрал ведущий.'],
    hard: ['Сложный режим', 'Автоматически включает роли, скрытую фейковую карту шпиона, тайное голосование, ограничивает раунд 7 минутами и выбирает один из сложных тематических наборов, если выбран слишком простой.'],
    traitor: ['Режим «Предатель»', 'Добавляет предателя: он знает настоящую локацию и роль, но побеждает вместе со шпионами. Число шпионов ограничивается, чтобы у мирных оставался шанс.'],
    category: ['Режим «Шпион знает категорию»', 'Шпион не знает точную локацию, но получает общую тему набора. Если включена фейковая роль, карта шпиона остаётся скрытой и выглядит как обычная.']
  };
  const [title, text] = lines[s.mode] || lines.classic;
  const forced = [];
  if(s.mode === 'hard') forced.push('роли включены', 'фейковая карта шпиона', 'тайное голосование', 'до 7 минут');
  if(s.mode === 'traitor') forced.push('предатель', 'тайное голосование', 'роли включены');
  if(s.spyFakeRole) forced.push('шпион получает ложную карту');
  return `<div class="card"><h3>${title}</h3><p>${text}</p>${forced.length ? `<div class="spacer"></div><p class="tiny">Активно: ${escapeHTML(forced.join(' · '))}</p>` : ''}</div>`;
}

  }
  const isSpy = a.team === 'spy';

  const hiddenHint = hiddenSpy ? `<p class="tiny">Карта выглядит как обычная. Играй по роли и отвечай осторожно.</p>` : '';
  const traitorHint = isTraitor ? `<p class="warn">Ты знаешь локацию, но побеждаешь вместе со шпионами. Запутывай мирных осторожно.</p>` : '';
  const readyBlock = iAmReady

  const startBlock = state.room?.status === 'card'
    ? (allReady ? (isHost() ? `<button class="button" data-action="go-play">Начать раунд</button>` : `<p class="oktext">Все готовы. Ждём, когда ведущий начнёт раунд.</p>`) : `<p class="muted">Ждём остальных игроков: <b>${readyCount}/${players.length}</b></p>`)

  </div></div>`;
}

function playScreen(){
  const r=state.room, s=r.settings || {}; const players=alivePlayers(); const current=players[r.currentTurnIndex % Math.max(players.length,1)];
  const remain = r.noTimer ? null : Math.max(0, Math.floor(((r.startedAt||now()) + (s.duration||420)*1000 - now())/1000));

  if(state.firebase){

async function getRoomPlayers(c){
  if(state.firebase){
    const snap = await F.getDocs(F.collection(F.db,'rooms',c,'players'));
    return snap.docs.map(d=>d.data()).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
  }
  const r = state.localRooms[c];
  return Object.values(r?.players||{}).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
}

async function enterRoom(c){
  c=(c||'').trim().toUpperCase();
  if(!c){ toast('Введи код комнаты'); return; }
  if(!state.profile.name.trim()){ state.modal=null; state.screen='profile'; render(); toast('Сначала укажи имя'); return; }
  try{
    clearSubs();
    state.roomCode=c;
    let room = await readRoom(c);
    if(!room){ state.roomCode=null; toast('Комната не найдена'); return; }
    const existing = await getRoomPlayers(c);
    const current = existing.find(p=>p.id===state.userId);
    const activeCount = existing.filter(p=>p.status !== 'observer' && p.status !== 'left').length;
    const maxPlayers = Number(room.settings?.playerMax || 15);
    let status = room.status==='lobby' ? 'active' : 'observer';
    if(room.status==='lobby' && !current && activeCount >= maxPlayers){
      status = 'observer';
      toast('Комната заполнена. Ты вошёл как наблюдатель.');
    }
    if(current?.status === 'observer' && room.status !== 'lobby') status = 'observer';
    await savePlayer(c, { id:state.userId, name:state.profile.name, avatar:state.profile.avatar||'🕵️', status, joinedAt:current?.joinedAt || now(), lastSeen:now() });
    subscribe(c);
    state.modal=null;
    applyRoomStatus(room);
    render();
  }catch(err){
    console.error(err);
    toast('Не удалось войти. Проверь правила Firestore');
  }
}

async function readRoom(c){
  if(state.firebase){ const snap = await F.getDoc(F.doc(F.db,'rooms',c)); return snap.exists()?snap.data():null; }
  return state.localRooms[c] || null;
}
async function updateRoom(patch){
  if(!state.roomCode) return;
  if(state.firebase){ await F.updateDoc(F.doc(F.db,'rooms',state.roomCode), patch); }
  else { state.localRooms[state.roomCode] = { ...(state.localRooms[state.roomCode]||{}), ...patch }; saveJSON('spy-own-local-rooms', state.localRooms); subscribeLocal(); }
}
async function savePlayer(c, player){
  if(state.firebase){ await F.setDoc(F.doc(F.db,'rooms',c,'players',player.id), player, {merge:true}); }
  else { const r=state.localRooms[c]; r.players = r.players || {}; r.players[player.id]=player; saveJSON('spy-own-local-rooms', state.localRooms); }
}
async function markCardReady(){
  if(!state.roomCode) return;
  if(state.firebase){
    await F.updateDoc(F.doc(F.db,'rooms',state.roomCode), {['cardReady.'+state.userId]: true});
  }else{
    await updateRoom({cardReady:{...(state.room?.cardReady||{}), [state.userId]:true}});
  }
}
function clearSubs(){ state.unsub.forEach(fn=>{try{fn()}catch{}}); state.unsub=[]; }
function subscribe(c){
  if(state.firebase){
    state.unsub.push(F.onSnapshot(F.doc(F.db,'rooms',c), snap=>{
      state.room=snap.exists()?snap.data():null;
      applyRoomStatus(state.room);
      if(state.room?.status === 'results') updateLocalStatsOnce();
      scheduleRender();
    }));
    state.unsub.push(F.onSnapshot(F.collection(F.db,'rooms',c,'players'), snap=>{
      state.players=snap.docs.map(d=>d.data()).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
      transferHostIfNeeded();
      scheduleRender();
    }));
    state.unsub.push(F.onSnapshot(F.query(F.collection(F.db,'rooms',c,'messages'), F.orderBy('createdAt','asc'), F.limit(80)), snap=>{ state.messages=snap.docs.map(d=>d.data()); scheduleRender(); }));
  } else subscribeLocal();
}
function subscribeLocal(){ const r=state.localRooms[state.roomCode]; state.room=r; applyRoomStatus(r); state.players=Object.values(r.players||{}).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)); state.messages=r.messages||[]; transferHostIfNeeded(); }

async function sendChat(){

    duration:Number(val('duration')), voteType:val('voteType'), leaderMode:val('leaderMode')==='true', mode:val('mode'), playerMin:3, playerMax:15, allowNoRoles:true
  };
  s = normalizeSettingsForMode(s);
  await updateRoom({settings:s}); toast('Настройки сохранены');

async function startGame(){
  if(!isHost()){ toast('Запускать игру может только ведущий'); return; }
  await saveRoomSettings();
  const room = await readRoom(state.roomCode); let s=normalizeSettingsForMode(room.settings||roomDefaults());
  const allActive=activePlayers();
  let players = s.leaderMode ? allActive.filter(p=>p.id!==state.room.hostId) : allActive;
  if(s.leaderMode){
    const hostPlayer = state.players.find(p=>p.id===state.room.hostId);
    if(hostPlayer) await savePlayer(state.roomCode, {...hostPlayer, status:'observer', lastSeen:now()});
  } else {
    const hostPlayer = state.players.find(p=>p.id===state.room.hostId);
    if(hostPlayer?.status==='observer') await savePlayer(state.roomCode, {...hostPlayer, status:'active', lastSeen:now()});
  }
  if(players.length < 3){ toast(s.leaderMode ? 'Нужно минимум 3 игрока кроме ведущего' : 'Минимум 3 игрока'); return; }
  if(s.mode === 'traitor' && players.length < 5){ toast('Для режима «Предатель» нужно минимум 5 игроков'); return; }
  if(players.length > 15){ toast('Максимум 15 игроков'); return; }
  const maxSpyCount = s.mode === 'traitor' ? Math.max(1, Math.min(3, Math.floor((players.length-1)/3))) : Math.max(1, Math.min(3, players.length-2));
  let spyCount = Math.min(Math.max(1, Number(s.spyCount||1)), maxSpyCount);
  let traitorId = null;
  const pack = getPack(s.packId); const location = shuffle(pack.locations)[0]; const order = shuffle(players).map(p=>p.id);
  const spyIds = order.slice(0, spyCount);
  if(s.mode === 'traitor' && players.length >= 5){
    traitorId = order.find(id=>!spyIds.includes(id)) || null;
  }
  const roles = shuffle(location.roles); const assignments={}; let ri=0; const usedRoles=new Set();
  function nextRole(list=roles){
    const source = (list && list.length ? list : roles);
    const fresh = source.find(role=>!usedRoles.has(role));
    const role = fresh || source[ri++ % source.length] || 'участник';
    usedRoles.add(role);
    return role;
  }
  players.forEach(p=>{
    const isSpy=spyIds.includes(p.id);
    const isTraitor=traitorId===p.id;
    if(isSpy){
      if(s.spyFakeRole && s.rolesEnabled){
        const fakeLocationObj = shuffle(pack.locations.filter(l=>l.name!==location.name))[0] || location;
        const fakeRole = nextRole(shuffle(fakeLocationObj.roles || roles));
        assignments[p.id] = {team:'spy', hiddenSpy:true, location:fakeLocationObj.name, role:fakeRole, fakeLocation:fakeLocationObj.name, fakeRole, category:''};
      } else {
        assignments[p.id] = {team:'spy', category: (s.mode==='category' || s.mode==='hard') ? (pack.tone || pack.name) : '', fakeRole:''};
      }
    } else if(isTraitor){
      assignments[p.id] = {team:'traitor', location:location.name, role:s.rolesEnabled ? nextRole(roles) : ''};
    } else {
      assignments[p.id] = {team:'players', location:location.name, role:s.rolesEnabled ? nextRole(roles) : ''};
    }
  });
  await updateRoom({ status:'card', roundId:uid(), settings:s, secret:{location, packId:pack.id, tone:pack.tone||pack.name}, assignments, spyIds, traitorId, order, currentTurnIndex:0, startedAt:null, noTimer:false, cardReady:{}, eliminatedSpyIds:[], votes:{}, voteStartedAt:null, voteDuration:30, result:null, timeEndedAt:null });
  state.lastCardHidden=true; state.screen='card'; render();
}

function buildVoteResolution(r, players, force=false){
  const votes = r.votes || {};
  const validVotes = {};
  players.forEach(p=>{
    const target = votes[p.id];
    if(target && target !== p.id && players.some(x=>x.id===target)) validVotes[p.id] = target;
  });
  if(Object.keys(validVotes).length < players.length && !force){
    return {error:'Не все проголосовали'};
  }
  const tally={};
  Object.values(validVotes).forEach(id=>tally[id]=(tally[id]||0)+1);
  const sorted=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const top=sorted[0]?.[0];
  if(!top){
    return {patch:{status:'results', result:{id:uid(), winner:'spies', reason:'Время голосования вышло, но никто не проголосовал.', endedAt:now()}}};
  }
  const topVotes=sorted[0][1];
  const tie=sorted.filter(x=>x[1]===topVotes).length>1;
  if(tie){
    return {patch:{status:'results', result:{id:uid(), winner:'spies', reason:'Ничья на голосовании. Шпионы воспользовались хаосом.', endedAt:now()}}};
  }
  const isSpy = (r.spyIds||[]).includes(top);
  if(!isSpy){
    return {patch:{status:'results', result:{id:uid(), winner:'spies', reason:'На голосовании выбрали не шпиона.', endedAt:now()}}};
  }
  const eliminated=[...(r.eliminatedSpyIds||[]), top].filter((v,i,a)=>a.indexOf(v)===i);
  const allFound=(r.spyIds||[]).every(id=>eliminated.includes(id));
  if(allFound){
    return {patch:{status:'results', eliminatedSpyIds: eliminated, result:{id:uid(), winner:'players', reason:'Все шпионы вычислены.', endedAt:now()}}};
  }
  return {patch:{status:'play', eliminatedSpyIds:eliminated, votes:{}, voteStartedAt:null, voteDuration:30, currentTurnIndex:(r.currentTurnIndex||0)+1, timeEndedAt:null, startedAt:now(), noTimer:false}};
}

async function processVote(force=false){
  if(!canControlRound()){ toast('Завершить голосование может ведущий'); return; }
  const currentRoom = state.room;
  if(!currentRoom || currentRoom.status==='results') return;
  const players=activePlayers();
  const resolution = buildVoteResolution(currentRoom, players, force);
  if(resolution.error){ toast(resolution.error); return; }
  if(state.firebase){
    const ref = F.doc(F.db,'rooms',state.roomCode);
    await F.runTransaction(F.db, async (tx)=>{
      const snap = await tx.get(ref);
      if(!snap.exists()) return;
      const latest = snap.data();
      if(latest.status === 'results') return;
      const latestPlayers = state.players.filter(p=>p.status !== 'observer' && p.status !== 'left' && !(latest.eliminatedSpyIds||[]).includes(p.id));
      const latestResolution = buildVoteResolution(latest, latestPlayers, force);
      if(latestResolution.error) throw new Error(latestResolution.error);
      tx.update(ref, latestResolution.patch);
    }).catch(err=>toast(err.message || 'Не удалось завершить голосование'));
  }else{
    await updateRoom(resolution.patch);
  }
}
async function finishGame(winner, reason){
  if(state.room?.status === 'results') return;
  const id = uid();
  await updateRoom({status:'results', result:{id, winner, reason, endedAt:now()}});
  updateLocalStatsOnce(id, winner);
}
function updateLocalStatsOnce(idArg, winnerArg){
  const key = idArg || resultKey();
  if(!key || state.seenResults[key]) return;
  const winner = winnerArg || state.room?.result?.winner;
  const a=assignmentFor(); if(!a || !winner) return;
  const playsWithSpies = a.team==='spy' || a.team==='traitor';
  const win=(winner==='spies' && playsWithSpies) || (winner==='players' && !playsWithSpies);
  state.stats.games += 1; if(win) state.stats.wins += 1; if(a.team==='spy'){ state.stats.spyGames += 1; if(win) state.stats.spyWins += 1; }
  state.seenResults[key] = true;
  saveJSON(STORAGE.stats,state.stats);
  saveJSON(STORAGE.seenResults,state.seenResults);
}


function addPack(){
  const name=document.querySelector('#newPackName')?.value.trim(); const text=document.querySelector('#newPackText')?.value.trim();
  if(!name || !text){ toast('Добавь название и локации'); return; }
  const locations=text.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{
    const [loc, rolesText=''] = line.split('|');
    const roles=rolesText.split(',').map(x=>x.trim()).filter(Boolean).slice(0,5);
    while(roles.length<5) roles.push('роль '+(roles.length+1));
    return {name:loc.trim(), roles};
  }).filter(x=>x.name);
  if(locations.length<3){ toast('Минимум 3 локации'); return; }
  const p={id:'custom_'+Date.now().toString(36), name, tone:'пользовательский', locations};
  state.customPacks.push(p); saveJSON(STORAGE.packs,state.customPacks); toast('Набор добавлен'); render();
}
function exportPack(id){
  const p=getPack(id); const data=btoa(unescape(encodeURIComponent(JSON.stringify(p))));
  navigator.clipboard?.writeText(data); toast('Код набора скопирован');
}
function importPack(){
  const text=document.querySelector('#importText')?.value.trim(); if(!text) return;
  try{ const p=JSON.parse(decodeURIComponent(escape(atob(text)))); p.id='custom_'+Date.now().toString(36); state.customPacks.push(p); saveJSON(STORAGE.packs,state.customPacks); state.modal=null; toast('Набор импортирован'); render(); }catch(e){ toast('Не получилось импортировать'); }
}

setInterval(async ()=>{
  if(state.room?.status !== 'play' || state.room?.noTimer) return;
  const s = state.room.settings || {};
  const remain = Math.max(0, Math.floor(((state.room.startedAt||now()) + (s.duration||420)*1000 - now())/1000));
  const timerEl = document.querySelector('.timer');
  if(timerEl){
    const m = String(Math.floor(remain/60)).padStart(2,'0');
    const sec = String(remain%60).padStart(2,'0');
    timerEl.textContent = `${m}:${sec}`;
  }
  if(remain <= 0 && !state.timerEnding && isRoomController()){
    state.timerEnding = true;
    try{ signalTimeUp({...state.room, timeEndedAt:now()}); await updateRoom({status:'timeup', timeEndedAt:now()}); }
    catch(e){ console.error(e); }
    setTimeout(()=>state.timerEnding=false, 2500);
  }
}, 1000);

setInterval(async ()=>{
  if(state.room?.status !== 'vote') return;
  const players = activePlayers();
  const votes = state.room.votes || {};
  const validVoteCount = players.filter(p=>votes[p.id] && votes[p.id] !== p.id && players.some(x=>x.id===votes[p.id])).length;
  const remain = Math.max(0, Math.ceil(((state.room.voteStartedAt || now()) + ((state.room.voteDuration || 30) * 1000) - now())/1000));
  const timerEl = document.querySelector('.timer');
  if(timerEl) timerEl.textContent = `00:${String(remain).padStart(2,'0')}`;
  if(!isRoomController() || state.voteAutoEnding) return;
  if(players.length && validVoteCount >= players.length){
    state.voteAutoEnding = true;
    try{ await processVote(false); } finally { setTimeout(()=>state.voteAutoEnding=false, 1500); }
  } else if(remain <= 0){
    state.voteAutoEnding = true;
    try{ signal('warning'); await processVote(true); } finally { setTimeout(()=>state.voteAutoEnding=false, 1500); }
  }
}, 1000);
setInterval(heartbeat, 10000);

async function heartbeat(){
  if(!state.roomCode || !state.profile.name || !state.room) return;
  const current = state.players.find(p=>p.id===state.userId);
  await savePlayer(state.roomCode, { id:state.userId, name:state.profile.name, avatar:state.profile.avatar||'🕵️', status:current?.status || 'active', joinedAt:current?.joinedAt || now(), lastSeen:now() });
  await markStalePlayers();
  transferHostIfNeeded();
}

async function markStalePlayers(){
  if(!['lobby','card','play','vote','timeup','results'].includes(state.room?.status)) return;
  const cutoff = now() - 45000;
  const stale = state.players.filter(p=>p.id!==state.userId && p.status!=='left' && p.lastSeen && p.lastSeen < cutoff);
  for(const p of stale){ await savePlayer(state.roomCode, {...p, status:'left'}); }
  const freshPlayers = state.players.map(p => stale.find(x=>x.id===p.id) ? {...p, status:'left'} : p);
  const leftSpies = (state.room.spyIds||[]).filter(id => freshPlayers.find(p=>p.id===id)?.status==='left');
  if(leftSpies.length && (state.room.spyIds||[]).every(id=>leftSpies.includes(id)) && state.room.status !== 'results'){
    await finishGame('players','Все шпионы вышли из игры.');
  }
}

document.addEventListener('input', (e)=>{
  if(e.target?.id === 'chatText') state.chatDraft = e.target.value;
});

document.addEventListener('focusin', (e)=>{
  if(e.target?.id === 'chatText') state.chatFocused = true;
});
document.addEventListener('focusout', (e)=>{
  if(e.target?.id === 'chatText'){
    setTimeout(()=>{
      state.chatFocused = document.activeElement?.id === 'chatText';
      if(!state.chatFocused && state.pendingRenderAfterChat){
        state.pendingRenderAfterChat = false;
        lastRenderedHTML = '';
        scheduleRender();
      }
    }, 60);
  }
});

document.addEventListener('keydown', async (e)=>{
  if(e.key === 'Enter' && e.target?.id === 'chatText'){ e.preventDefault(); await sendChat(); }
  if(e.key === 'Enter' && e.target?.id === 'joinCode'){ e.preventDefault(); await enterRoom(e.target.value); }
});

document.addEventListener('click', async (e)=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action;
  if(a==='close-modal' && el.classList.contains('modal') && e.target !== el) return;
  if(a==='home'){ state.screen='home'; state.modal=null; clearSubs(); render(); }
  if(a==='profile'){ state.screen='profile'; state.modal=null; render(); }
  if(a==='rules'){ state.screen='rules'; render(); }
  if(a==='settings-global'){ state.screen='settingsGlobal'; render(); }
  if(a==='packs'){ state.screen='packs'; render(); }
  if(a==='join-modal'){ state.modal='join'; render(); }
  if(a==='close-modal'){ state.modal=null; render(); }
  if(a==='save-profile'){
    state.profile={name:document.querySelector('#profileName').value.trim(), avatar:document.querySelector('#profileAvatar').value.trim()||'🕵️'}; saveJSON(STORAGE.profile,state.profile); toast('Профиль сохранён'); render();
  }
  if(a==='reset-stats'){ state.stats={games:0,wins:0,spyGames:0,spyWins:0}; saveJSON(STORAGE.stats,state.stats); render(); }
  if(a==='create-room') await createRoom();
  if(a==='join-room') await enterRoom(document.querySelector('#joinCode')?.value);
  if(a==='copy-code'){ navigator.clipboard?.writeText(state.roomCode); toast('Код скопирован'); }
  if(a==='share-room') await shareRoom();
  if(a==='leave-room'){ const p=me(); if(p) await savePlayer(state.roomCode,{...p,status:'left',lastSeen:now()}); clearSubs(); state.roomCode=null; state.room=null; state.players=[]; state.messages=[]; state.screen='home'; render(); }
  if(a==='save-room-settings') await saveRoomSettings();
  if(a==='start-game') await startGame();
  if(a==='show-card'){ state.lastCardHidden=false; render(); }
  if(a==='card-ready'){
    if(!state.room || state.room.status !== 'card') return;
    await markCardReady();
    toast('Ты готов');
  }
  if(a==='hide-card'){ state.lastCardHidden=true; if(state.room?.status !== 'card'){ state.screen=screenForStatus(state.cardReturnTo||state.room?.status||'play'); } render(); }
  if(a==='return-card' || a==='go-room-status'){ state.lastCardHidden=true; state.screen=screenForStatus(state.cardReturnTo || state.room?.status || 'lobby'); render(); }
  if(a==='card'){ state.cardReturnTo = state.room?.status || 'play'; state.screen='card'; state.lastCardHidden=true; render(); }
  if(a==='go-play'){
    if(!isHost()){ toast('Начать раунд может ведущий'); return; }
    if(!everybodyCardReady()){ toast('Ещё не все игроки готовы'); return; }
    await updateRoom({status:'play', startedAt:now()}); state.screen='play'; render();
  }
  if(a==='next-turn'){ if(!canControlRound()){ toast('Ход переключает ведущий'); return; } await updateRoom({currentTurnIndex:(state.room.currentTurnIndex||0)+1}); }
  if(a==='start-vote'){ if(!canControlRound()){ toast('Голосование запускает ведущий'); return; } await updateRoom({status:'vote', votes:{}, voteStartedAt:now(), voteDuration:30, timeEndedAt:null}); }
  if(a==='cancel-vote'){ if(!canControlRound()){ toast('Отменить может ведущий'); return; } await updateRoom({status:'play', votes:{}, voteStartedAt:null}); }
  if(a==='vote-player'){ const players=alivePlayers(); if(!players.some(p=>p.id===state.userId) || isEliminated(state.userId)){ toast('Ты не участвуешь в голосовании'); return; } if(el.dataset.id===state.userId){ toast('За себя голосовать нельзя'); return; } if(!players.some(p=>p.id===el.dataset.id)){ toast('Игрок уже не участвует'); return; } if(state.firebase){ await F.updateDoc(F.doc(F.db,'rooms',state.roomCode), {['votes.'+state.userId]: el.dataset.id}); } else { await updateRoom({votes:{...(state.room.votes||{}), [state.userId]:el.dataset.id}}); } }
  if(a==='finish-vote') await processVote(false);
  if(a==='force-finish-vote') await processVote(true);
  if(a==='add-minute'){ if(!canControlRound()) return; const s=state.room.settings||{}; await updateRoom({status:'play', noTimer:false, startedAt: now() - (Number(s.duration||420)*1000) + 60000, timeEndedAt:null}); }
  if(a==='continue-no-timer'){ if(!canControlRound()) return; await updateRoom({status:'play', noTimer:true, timeEndedAt:null}); }
  if(a==='guess-modal'){ state.modal='guess'; render(); }
  if(a==='spy-guess'){
    const guess=el.dataset.location; const real=state.room.secret.location.name;
    if(!canUseSpyGuess()){ toast('Угадывать может только активный шпион'); return; }
    state.modal=null; await finishGame(guess===real?'spies':'players', guess===real?'Шпион угадал локацию.':'Шпион ошибся с локацией.');
  }
  if(a==='send-chat') await sendChat();
  if(a==='new-round'){ if(!canControlRound()) return; if(state.room?.result?.endedAt && now()-state.room.result.endedAt < 3000){ toast('Итоги показываются минимум несколько секунд'); return; } await updateRoom({status:'lobby', roundId:null, assignments:null, spyIds:[], traitorId:null, secret:null, result:null, votes:{}, voteStartedAt:null, voteDuration:30, cardReady:{}, eliminatedSpyIds:[], startedAt:null, noTimer:false, timeEndedAt:null}); }
  if(a==='view-pack'){ state.modal='pack:'+el.dataset.pack; render(); }
  if(a==='add-pack') addPack();
  if(a==='share-pack') exportPack(el.dataset.pack);
  if(a==='import-pack'){ state.modal='import'; render(); }
  if(a==='do-import-pack') importPack();
});

boot();

  </script>
